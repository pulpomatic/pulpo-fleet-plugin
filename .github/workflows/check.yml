name: Check catalog
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-catalog.mjs
      - run: node scripts/eval-default-mocks.mjs
      - run: node scripts/check-evals.mjs
      - run: node scripts/eval-instructions.mjs
